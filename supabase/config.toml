[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322

[auth]
enabled = true
site_url = "https://zekapark.vercel.app"
additional_redirect_urls = [
  "https://zekapark.vercel.app/reset-password",
  "https://zekapark.vercel.app",
  "http://localhost:5173/reset-password",
  "http://localhost:5173",
  "http://localhost:3000/reset-password",
  "http://localhost:3000"
]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[auth.email.template.confirmation]
subject = "Bilsem Junior e-posta adresinizi doğrulayın"
content_path = "./templates/confirm-sign-up.html"

[auth.email.template.recovery]
subject = "Bilsem Junior şifrenizi sıfırlayın"
content_path = "./templates/reset-password.html"

[auth.email.template.magic_link]
subject = "Bilsem Junior giriş bağlantınız"
content_path = "./templates/magic-link-or-otp.html"

[auth.email.template.email_change]
subject = "Bilsem Junior e-posta değişikliğini doğrulayın"
content_path = "./templates/change-email-address.html"

[auth.email.template.invite]
subject = "Bilsem Junior hesabınıza davet edildiniz"
content_path = "./templates/invite-user.html"

[auth.email.template.reauthentication]
subject = "Bilsem Junior doğrulama kodunuz"
content_path = "./templates/reauthentication.html"
