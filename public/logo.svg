<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" role="img" aria-label="ZekaPark Sevimli Bilge Baykuş Zeki Maskot Logosu">
  <defs>
    <!-- App Icon Squircle Background: Warm Royal Indigo to Deep Sky -->
    <linearGradient id="bgSquircle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="45%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Inner Ambient Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#818cf8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0"/>
    </radialGradient>

    <!-- Mascot Plumage: Vibrant 3D Cobalt & Periwinkle -->
    <radialGradient id="owlBodyGrad" cx="42%" cy="30%" r="68%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="45%" stop-color="#4f46e5"/>
      <stop offset="85%" stop-color="#3730a3"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </radialGradient>

    <!-- Ear Tufts & Wing Gradient -->
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="55%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>

    <!-- Soft Cream Face Mask & Belly -->
    <linearGradient id="creamMaskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#fef9c3"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>

    <!-- Golden Beak & Feet -->
    <linearGradient id="beakGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="45%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Explorer Crown / Zeka Star Gradient -->
    <linearGradient id="crownGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Mint Emerald Tangram Badge -->
    <linearGradient id="mintBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Eye Iris Depth -->
    <radialGradient id="irisGrad" cx="50%" cy="62%" r="55%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="45%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>

    <!-- Soft Character Drop Shadow -->
    <filter id="mascotShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#090d16" flood-opacity="0.48"/>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#fde047" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- 1. App Icon Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#bgSquircle)"/>
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#ambientGlow)"/>
  <rect x="20" y="20" width="472" height="472" rx="112" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="5"/>

  <!-- Subtle Background Sparkles -->
  <g fill="#fef08a" opacity="0.85">
    <path d="M 96 108 Q 96 124 80 124 Q 96 124 96 140 Q 96 124 112 124 Q 96 124 96 108 Z"/>
    <path d="M 422 102 Q 422 114 410 114 Q 422 114 422 126 Q 422 114 434 114 Q 422 114 422 102 Z" fill="#6ee7b7"/>
    <circle cx="84" cy="364" r="5" fill="#38bdf8" opacity="0.7"/>
    <circle cx="432" cy="348" r="6" fill="#f472b6" opacity="0.7"/>
  </g>

  <!-- 2. Main Mascot Group: "Bilge Baykuş Zeki" -->
  <g filter="url(#mascotShadow)">
    <!-- Cute Perky Owl Ear Tufts -->
    <path d="M 136 176 C 110 128, 128 96, 174 126 C 188 135, 196 150, 192 170 Z" fill="url(#wingGrad)"/>
    <path d="M 376 176 C 402 128, 384 96, 338 126 C 324 135, 316 150, 320 170 Z" fill="url(#wingGrad)"/>
    <!-- Inner Ear Highlights -->
    <path d="M 146 164 C 132 138, 142 118, 168 136 Z" fill="#93c5fd" opacity="0.55"/>
    <path d="M 366 164 C 380 138, 370 118, 344 136 Z" fill="#93c5fd" opacity="0.55"/>

    <!-- Plump Rounded Owl Body & Head -->
    <rect x="116" y="122" width="280" height="296" rx="138" fill="url(#owlBodyGrad)"/>

    <!-- 3D Top Forehead Highlight -->
    <ellipse cx="238" cy="148" rx="76" ry="22" fill="#93c5fd" opacity="0.28"/>

    <!-- Left Wing (Resting Warmly) -->
    <path d="M 122 246 C 84 268, 86 344, 128 368 C 146 378, 154 344, 144 292 Z" fill="url(#wingGrad)"/>

    <!-- Right Wing (Cheerfully Waving Upward!) -->
    <path d="M 386 238 C 434 202, 446 266, 408 318 C 392 340, 376 322, 378 276 Z" fill="url(#wingGrad)"/>
    <path d="M 392 248 C 420 226, 426 264, 402 298 Z" fill="#7dd3fc" opacity="0.4"/>

    <!-- Soft Cream Belly Patch -->
    <ellipse cx="256" cy="348" rx="88" ry="62" fill="url(#creamMaskGrad)"/>

    <!-- Cute Scalloped Belly Feather Marks -->
    <path d="M 222 332 Q 234 344 246 332" fill="none" stroke="#cbd5e1" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 266 332 Q 278 344 290 332" fill="none" stroke="#cbd5e1" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 244 354 Q 256 366 268 354" fill="none" stroke="#cbd5e1" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Heart-Shaped Cream Facial Disc Around Eyes -->
    <path d="M 256 196 C 224 166, 142 174, 142 238 C 142 292, 198 312, 256 302 C 314 312, 370 292, 370 238 C 370 174, 288 166, 256 196 Z" fill="url(#creamMaskGrad)"/>

    <!-- Expressive Big Left Eye -->
    <g>
      <circle cx="198" cy="238" r="46" fill="#ffffff" stroke="#e2e8f0" stroke-width="3"/>
      <circle cx="202" cy="238" r="34" fill="url(#irisGrad)"/>
      <!-- Turquoise Iris Crescent -->
      <path d="M 178 252 A 28 28 0 0 0 226 252 A 24 20 0 0 1 178 252 Z" fill="#38bdf8" opacity="0.65"/>
      <!-- Crisp Catchlights -->
      <circle cx="188" cy="222" r="12" fill="#ffffff"/>
      <circle cx="216" cy="250" r="5.5" fill="#ffffff"/>
    </g>

    <!-- Expressive Big Right Eye -->
    <g>
      <circle cx="314" cy="238" r="46" fill="#ffffff" stroke="#e2e8f0" stroke-width="3"/>
      <circle cx="310" cy="238" r="34" fill="url(#irisGrad)"/>
      <!-- Turquoise Iris Crescent -->
      <path d="M 286 252 A 28 28 0 0 0 334 252 A 24 20 0 0 1 286 252 Z" fill="#38bdf8" opacity="0.65"/>
      <!-- Crisp Catchlights -->
      <circle cx="296" cy="222" r="12" fill="#ffffff"/>
      <circle cx="324" cy="250" r="5.5" fill="#ffffff"/>
    </g>

    <!-- Cute Rosy Blush Cheeks -->
    <ellipse cx="158" cy="274" rx="18" ry="10" fill="#fb7185" opacity="0.58"/>
    <ellipse cx="354" cy="274" rx="18" ry="10" fill="#fb7185" opacity="0.58"/>

    <!-- Sculpted Golden Beak & Happy Smile -->
    <path d="M 238 260 Q 256 250 274 260 C 278 274, 266 292, 256 296 C 246 292, 234 274, 238 260 Z" fill="url(#beakGrad)"/>
    <!-- Beak Specular Highlight -->
    <ellipse cx="252" cy="264" rx="8" ry="4" fill="#fef9c3" opacity="0.75"/>

    <!-- Emerald Tangram Star Badge on Chest -->
    <g transform="translate(256, 384)">
      <circle cx="0" cy="0" r="22" fill="url(#mintBadgeGrad)" stroke="#ffffff" stroke-width="3"/>
      <path d="M 0 -12 L 3.8 -3.8 L 12 0 L 3.8 3.8 L 0 12 L -3.8 3.8 L -12 0 L -3.8 -3.8 Z" fill="#fef08a"/>
    </g>

    <!-- Cute Little Golden Owl Feet -->
    <g fill="url(#beakGrad)">
      <rect x="192" y="404" width="38" height="22" rx="11"/>
      <rect x="282" y="404" width="38" height="22" rx="11"/>
    </g>

    <!-- 3. Crown of Curiosity: Floating Golden Sparkle Star on Zeki's Head -->
    <g filter="url(#softGlow)">
      <path d="M 256 68 L 269 98 L 302 102 L 277 123 L 284 155 L 256 138 L 228 155 L 235 123 L 210 102 L 243 98 Z" fill="url(#crownGrad)" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="256" cy="115" r="7" fill="#ffffff" opacity="0.9"/>
    </g>
  </g>
</svg>
