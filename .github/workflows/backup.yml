name: Encrypted database backup
on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'
permissions:
  contents: read
  packages: read
concurrency:
  group: database-backup
  cancel-in-progress: false
jobs:
  backup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production-backup
    env:
      DOCKER_CONFIG: ${{ runner.temp }}/bilsem-backup-ghcr
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install PostgreSQL 17 clients from verified PGDG
        run: |
          # Ubuntu 24.04 ships PostgreSQL 16. Add the official signed PGDG
          # repository explicitly; a 16 client cannot dump the production 17 DB.
          sudo apt-get update
          sudo apt-get install --yes ca-certificates curl gnupg
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          fingerprint="$(gpg --show-keys --with-colons /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc | awk -F: '$1 == "fpr" { print $10; exit }')"
          test "$fingerprint" = 'B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8'
          printf '%s\n' \
            'Types: deb' \
            'URIs: https://apt.postgresql.org/pub/repos/apt' \
            'Suites: noble-pgdg' \
            'Components: main' \
            'Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc' \
            | sudo tee /etc/apt/sources.list.d/pgdg.sources >/dev/null
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-17
          echo '/usr/lib/postgresql/17/bin' >> "$GITHUB_PATH"
      - name: Validate backup configuration without exposing values
        run: node scripts/backup-config.mjs
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
      - name: Create and encrypt backup
        run: node scripts/backup-database.mjs
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
      - name: Authenticate official image pulls with the read-only job identity
        env:
          GHCR_JOB_TOKEN: ${{ github.token }}
          GHCR_JOB_ACTOR: ${{ github.actor }}
        run: |
          install -d -m 700 "$DOCKER_CONFIG"
          printf '%s' "$GHCR_JOB_TOKEN" | docker login ghcr.io --username "$GHCR_JOB_ACTOR" --password-stdin
      - name: Verify encrypted archive in a fresh isolated Supabase
        run: node scripts/verify-backup-restore.mjs zekapark-database.enc
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
      - name: Retain encrypted archive
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          include-hidden-files: false
          name: database-backup-${{ github.run_id }}
          path: |
            zekapark-database.enc
            backup-restore-verification.json
          if-no-files-found: error
          retention-days: 30
      - name: Remove working archive
        if: always()
        run: rm -f zekapark-database.enc backup-restore-verification.json "$DOCKER_CONFIG/config.json"
