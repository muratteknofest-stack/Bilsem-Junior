name: Encrypted database backup
on:
  workflow_dispatch:
  # A reviewed backup change must prove recovery on the merged main source.
  push:
    branches: [main]
    paths:
      - 'scripts/*backup*'
      - '.github/workflows/backup.yml'
  schedule:
    - cron: '0 2 * * *'
permissions:
  contents: read
concurrency:
  group: database-backup
  cancel-in-progress: false
jobs:
  backup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production-backup
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install PostgreSQL 17 clients from verified PGDG
        run: |
          # Ubuntu 24.04 ships PostgreSQL 16. Add the official signed PGDG
          # repository explicitly; a 16 client cannot dump the production 17 DB.
          sudo apt-get update
          sudo apt-get install --yes ca-certificates curl gnupg
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          fingerprint="$(gpg --show-keys --with-colons /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc | awk -F: '$1 == "fpr" { print $10; exit }')"
          test "$fingerprint" = 'B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8'
          printf '%s\n' \
            'Types: deb' \
            'URIs: https://apt.postgresql.org/pub/repos/apt' \
            'Suites: noble-pgdg' \
            'Components: main' \
            'Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc' \
            | sudo tee /etc/apt/sources.list.d/pgdg.sources >/dev/null
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-17
          echo '/usr/lib/postgresql/17/bin' >> "$GITHUB_PATH"
      - name: Validate backup configuration without exposing values
        run: node scripts/backup-config.mjs
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
      # Diagnose every stage separately so a failed run names the stage and the
      # operator action instead of leaving only an opaque dump error behind.
      - name: Diagnose backup pipeline without exposing values
        run: node scripts/backup-doctor.mjs --report backup-doctor.json
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
      - name: Create and encrypt backup
        id: database_archive
        run: node scripts/backup-database.mjs
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
      - name: Create and encrypt separate Storage archive
        id: storage_archive
        run: node scripts/backup-storage.mjs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
      - name: Verify encrypted archive in a fresh isolated Supabase
        if: ${{ always() && steps.database_archive.outcome == 'success' }}
        run: |
          archives=(zekapark-database.enc)
          if [ "$STORAGE_ARCHIVE_OUTCOME" = 'success' ]; then archives+=(zekapark-storage.enc); fi
          node scripts/verify-backup-restore.mjs "${archives[@]}"
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          STORAGE_ARCHIVE_OUTCOME: ${{ steps.storage_archive.outcome }}
      # The evidence record is written for successes and failures alike. Its
      # failure exit code must not hide the real failing step above.
      - name: Publish sanitized backup status
        if: always()
        continue-on-error: true
        run: >-
          node scripts/backup-status.mjs
          --doctor backup-doctor.json
          --verification backup-restore-verification.json
          --storage-verification backup-storage-verification.json
          --storage-required
          --output backup-status.json
      # Commercial obligations may still be pending after a valid restore.
      # Record the closure result without masking any failing backup step.
      - name: Evaluate release closure with this run restore receipt
        if: always()
        continue-on-error: true
        run: >-
          node scripts/release-closure.mjs
          --backup-receipt backup-restore-verification.json
          --storage-receipt backup-storage-verification.json
          --output backup-release-closure.json
      - name: Retain encrypted archive
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          include-hidden-files: false
          name: database-backup-${{ github.run_id }}
          path: |
            zekapark-database.enc
            zekapark-storage.enc
            backup-restore-verification.json
            backup-storage-verification.json
            backup-doctor.json
            backup-status.json
            backup-release-closure.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Remove working archive
        if: always()
        run: rm -f zekapark-database.enc zekapark-storage.enc zekapark-storage.enc.pending backup-restore-verification.json backup-storage-verification.json backup-doctor.json backup-status.json backup-release-closure.json
