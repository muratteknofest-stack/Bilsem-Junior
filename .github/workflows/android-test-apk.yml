name: Android test APK
on:
  push:
    branches: [codex/android-capacitor-preparation]
    paths:
      - '.github/workflows/android-test-apk.yml'
      - 'mobile/**'
      - 'src/**'
      - 'scripts/prepare-android.mjs'
      - 'capacitor.config.ts'
      - 'package*.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # These are existing PUBLIC browser settings, never server credentials.
      VITE_API_BASE_URL: https://zekapark.vercel.app
      VITE_PUBLIC_SITE_URL: https://zekapark.vercel.app
      VITE_SUPABASE_URL: https://vehhvsdkifwstbjhnhao.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ijE2Jbn1oGn9Elz03fiYrA_FUBnEWXI
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Use the runner's installed JDK and Android SDK
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
      - run: npm ci
      - run: npm run lint
      - run: npm run test:android && npm run test:google-play
      - run: npm run android:sync
      - name: Compile debug APK without a production signing key
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - name: Verify and collect installable package
        run: |
          mkdir -p test-artifacts/android
          cp android/app/build/outputs/apk/debug/app-debug.apk test-artifacts/android/ZekaPark-test.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs test-artifacts/android/ZekaPark-test.apk > test-artifacts/android/signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging test-artifacts/android/ZekaPark-test.apk > test-artifacts/android/package.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree test-artifacts/android/ZekaPark-test.apk AndroidManifest.xml > test-artifacts/android/manifest.txt
          sha256sum test-artifacts/android/ZekaPark-test.apk > test-artifacts/android/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ZekaPark-test-apk
          path: test-artifacts/android/
          if-no-files-found: error
          retention-days: 7
