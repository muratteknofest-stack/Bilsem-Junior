name: Android test APK
on:
  push:
    branches: [codex/android-capacitor-preparation]
    paths:
      - '.github/workflows/android-test-apk.yml'
      - 'mobile/**'
      - 'src/**'
      - 'scripts/prepare-android.mjs'
      - 'tests/android*'
      - 'capacitor.config.ts'
      - 'package*.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # These are existing PUBLIC browser settings, never server credentials.
      VITE_API_BASE_URL: https://zekapark.vercel.app
      VITE_PUBLIC_SITE_URL: https://zekapark.vercel.app
      VITE_SUPABASE_URL: https://vehhvsdkifwstbjhnhao.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ijE2Jbn1oGn9Elz03fiYrA_FUBnEWXI
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Use the runner's installed JDK and Android SDK
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
      - run: npm ci
      - run: npm run lint
      - run: npm run test:android && npm run test:google-play
      - run: npm run android:sync
      - name: Compile debug APK without a production signing key
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Start an Android 15 test device
        run: |
          sudo chmod a+rw /dev/kvm
          sdkmanager 'system-images;android-35;google_apis;x86_64'
          printf 'no\n' | avdmanager create avd --name zekapark-test --package 'system-images;android-35;google_apis;x86_64' --device pixel_6 --force
          "$ANDROID_HOME/emulator/emulator" -avd zekapark-test -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > /tmp/zekapark-emulator.log 2>&1 &
          timeout 180 adb wait-for-device
          for attempt in $(seq 1 90); do
            if adb shell getprop sys.boot_completed | tr -d '\r' | grep -q '^1$'; then break; fi
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell input keyevent 82
      - name: Verify installed app, native API, registration form and Android Back
        working-directory: android
        run: ./gradlew --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.zekapark.app.NativeAppSmokeTest
      - name: Save device diagnostics
        if: always()
        run: |
          mkdir -p test-artifacts/android-device
          cp /tmp/zekapark-emulator.log test-artifacts/android-device/ 2>/dev/null || true
          adb logcat -d -t 1500 > test-artifacts/android-device/logcat.txt 2>/dev/null || true
          cp -R android/app/build/reports/androidTests test-artifacts/android-device/ 2>/dev/null || true
          cp -R android/app/build/outputs/androidTest-results test-artifacts/android-device/ 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ZekaPark-android-device-checks
          path: test-artifacts/android-device/
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify and collect installable package
        run: |
          mkdir -p test-artifacts/android
          cp android/app/build/outputs/apk/debug/app-debug.apk test-artifacts/android/ZekaPark-test-v2.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs test-artifacts/android/ZekaPark-test-v2.apk > test-artifacts/android/signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging test-artifacts/android/ZekaPark-test-v2.apk > test-artifacts/android/package.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree test-artifacts/android/ZekaPark-test-v2.apk AndroidManifest.xml > test-artifacts/android/manifest.txt
          sha256sum test-artifacts/android/ZekaPark-test-v2.apk > test-artifacts/android/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ZekaPark-test-apk
          path: test-artifacts/android/
          if-no-files-found: error
          retention-days: 7
