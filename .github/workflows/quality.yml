name: Quality and Function build
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
env:
  VITE_PUBLIC_SITE_URL: https://bilsemjunior.vercel.app
  VITE_SUPABASE_URL: https://vtcsoqohkiagbwatlabk.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_J972I2--TwnuLkWjrRqENA_DxnBGjlz
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Temporary audited dependency lock regeneration
        run: |
          npm pkg set overrides.glob=14.0.2 overrides.minimatch=11.0.1
          npm install --package-lock-only --ignore-scripts --no-audit
          node -e 'const b=require("node:fs").readFileSync("package-lock.json","utf8");for(let i=0;i<b.length;i+=4000)console.log("BILSEM_LOCK_PART="+(i/4000)+":"+JSON.stringify(b.slice(i,i+4000)))'
      - run: npm run security:ci
      - run: npm test
      - name: Verify Cloud setup and Android artifact integrity checks
        run: npm run test:google-play:cloud && npm run test:android-release
      - run: npm run test:student
      - run: npm audit --audit-level=moderate
      - run: npm run security:audit
      - run: npm run vercel-build
      - name: Verify the compiled production HTTP server
        run: |
          npx --no-install esbuild server.ts --bundle --platform=node --format=cjs --packages=external --outfile=build/server.cjs
          node scripts/security-http-smoke.mjs
      - run: npm run test:load
      - name: Install Chromium for mobile and tablet layout checks
        run: npx --no-install playwright install --with-deps chromium
      - name: Check question layouts on mobile and tablet viewports
        run: npm run test:layout
      - name: Check original question artwork and silhouette uniqueness
        run: npm run test:question-art
      - name: Check entry routes, separate student progress and activity timer cleanup
        run: npm run test:audit-browser

      - name: Check Google Play membership controls on mobile and tablet
        run: npm run test:play-layout
      - name: Verify English practice, device progress and mobile layouts
        run: npm run test:english-browser

  student-game-world:
    env:
      BILSEM_STUDENT_VISUAL_PREVIEW: '1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium
      - id: game_ui
        run: npm run test:student-game
      - if: ${{ success() || steps.game_ui.conclusion == 'failure' }}
        run: npm run test:student-motion
      - name: Save student game design previews
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          include-hidden-files: false
          name: student-game-world-previews
          path: |
            test-artifacts/student-game-world/
            test-artifacts/student-motion/
          if-no-files-found: ignore
          retention-days: 7

  topic-lessons:
    env:
      BILSEM_LESSON_VISUAL_PREVIEW: '1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:lessons:browser
      - name: Save lesson library and player previews
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          include-hidden-files: false
          name: topic-lessons-previews
          path: test-artifacts/topic-lessons/
          if-no-files-found: ignore
          retention-days: 7

  english-accounts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium
      - name: Verify English family accounts and saved learning flows
        run: npm run test:english-accounts

      - name: Save ThinkHarbor screen previews for design review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          include-hidden-files: false
          name: thinkharbor-design-previews
          path: test-artifacts/thinkharbor/
          if-no-files-found: ignore
          retention-days: 7

  turkish-accounts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:turkish-accounts

      - name: Save student workspace previews for design review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          include-hidden-files: false
          name: zekapark-student-design-previews
          path: test-artifacts/student/
          if-no-files-found: ignore
          retention-days: 7

  branding:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium
      - name: Verify Bilsem Junior branding and responsive public flows
        run: node scripts/check-bilsem-brand.mjs
      - name: Save Bilsem Junior design previews
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          include-hidden-files: false
          name: bilsem-junior-design-previews
          path: test-artifacts/bilsem-junior/
          if-no-files-found: ignore
          retention-days: 7

  live-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, english-accounts, turkish-accounts, learning-launch, branding, topic-lessons, student-game-world]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: 22
      - name: Verify the actual production release and Turkish public routes
        run: node scripts/check-live-release.mjs https://bilsemjunior.vercel.app "$GITHUB_SHA" vtcsoqohkiagbwatlabk

  learning-launch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium
      - name: Check playful learning menu, audio preferences and topic search
        run: npm run test:learning-launch
      - name: Save learning menu screen previews
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          include-hidden-files: false
          name: learning-launch-previews
          path: test-artifacts/learning-launch/
          if-no-files-found: ignore
          retention-days: 7
