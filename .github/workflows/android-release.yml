name: Google Play Android candidate
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VITE_API_BASE_URL: https://bilsemjunior.vercel.app
      VITE_PUBLIC_SITE_URL: https://bilsemjunior.vercel.app
      VITE_SUPABASE_URL: https://vtcsoqohkiagbwatlabk.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_J972I2--TwnuLkWjrRqENA_DxnBGjlz
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Select JDK 21
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
      - run: npm ci
      - name: Install the exact Android release SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0" "build-tools;36.0.0" "platforms;android-36"'
      - run: npm run lint && npm run test:google-play
      - run: npm run android:sync
      - name: Verify billing screens
        run: |
          npx playwright install --with-deps chromium
          node --import tsx scripts/check-google-play-ui.tsx
          npm run test:android-entry
          npm run test:android-parent
      - name: Verify Android story adventure and simplified menus
        run: npm run test:android-story
      - name: Compile Android Billing and release bundle
        working-directory: android
        run: ./gradlew --no-daemon :app:bundleRelease :app:assembleRelease :app:assembleDebug :app:writeReleaseDependencyInventory
      - name: Verify release security
        run: python3 scripts/package-android-candidate.py test-artifacts/android
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Bilsem-Junior-Android-candidate
          path: |
            test-artifacts/android/
            test-artifacts/google-play-ui/
            test-artifacts/android-story/
            test-artifacts/android-entry/
            test-artifacts/android-parent/
          if-no-files-found: ignore
          retention-days: 7
