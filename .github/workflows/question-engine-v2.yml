name: Question engine V2 checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: engine-v2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: https://vtcsoqohkiagbwatlabk.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_J972I2--TwnuLkWjrRqENA_DxnBGjlz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint && npm test
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:review-batch:browser
      - run: npm run test:engine-v2:mobile
      - run: npm run test:preview-auth:browser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          include-hidden-files: false
          name: engine-v2-mobile-evidence
          path: |
            test-artifacts/review-batch/
            test-artifacts/engine-v2/
            test-artifacts/protected-preview-auth/
          if-no-files-found: ignore
          retention-days: 7
