name: Question engine V2 checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: engine-v2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: https://vtcsoqohkiagbwatlabk.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_J972I2--TwnuLkWjrRqENA_DxnBGjlz
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint && npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:engine-v2:mobile
      - run: npm run test:preview-auth:browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: engine-v2-mobile-evidence
          path: |
            test-artifacts/engine-v2/
            test-artifacts/protected-preview-auth/
          if-no-files-found: ignore
          retention-days: 7
