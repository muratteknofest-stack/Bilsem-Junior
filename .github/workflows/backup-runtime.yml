name: Isolated backup runtime
on:
  pull_request:
    paths:
      - 'scripts/*backup*'
      - '.github/workflows/backup*.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/*backup*'
      - '.github/workflows/backup*.yml'
permissions:
  contents: read
  packages: read
jobs:
  backup-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: 22
      - name: Authenticate official image pulls with the read-only job identity
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/bilsem-backup-ghcr
          GHCR_JOB_TOKEN: ${{ github.token }}
          GHCR_JOB_ACTOR: ${{ github.actor }}
        run: |
          install -d -m 700 "$DOCKER_CONFIG"
          printf '%s' "$GHCR_JOB_TOKEN" | docker login ghcr.io --username "$GHCR_JOB_ACTOR" --password-stdin
      - name: Check the restore runtime without production credentials or records
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/bilsem-backup-ghcr
        run: node scripts/verify-backup-restore.mjs --runtime-check
      - name: Remove temporary registry credentials
        if: always()
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/bilsem-backup-ghcr
        run: rm -f "$DOCKER_CONFIG/config.json"
