name: Isolated backup runtime
on:
  pull_request:
    paths:
      - 'scripts/*backup*'
      - '.github/workflows/backup*.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/*backup*'
      - '.github/workflows/backup*.yml'
permissions:
  contents: read
jobs:
  backup-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: 22
      - name: Check the restore runtime without production credentials or records
        run: node scripts/verify-backup-restore.mjs --runtime-check
