name: Production health monitor
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: read
concurrency:
  group: production-health
  cancel-in-progress: true
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: node scripts/monitor-site.mjs
        env:
          MONITOR_REPORT_FILE: health-report.json
      - name: Preserve route timing and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-health-report
          path: health-report.json
          retention-days: 7
          if-no-files-found: ignore

