name: Bilsem Junior - daily Instagram Reels at 19:00 TR

on:
  schedule:
    # Prepare before 19:00 Europe/Istanbul (UTC+3 = 16:00 UTC) and publish at 19:00 TR.
    - cron: '35 15 * * *'
  workflow_dispatch:
    inputs:
      reel_date:
        description: Optional YYYY-MM-DD override for preview generation
        required: false
        type: string
      grade:
        description: Optional class level (1-4)
        required: false
        type: string
      difficulty:
        description: Optional difficulty (1-3)
        required: false
        type: string
      mechanic:
        description: Optional verified visual question mechanic or auto
        required: false
        type: string
      request_id:
        description: Optional admin request correlation UUID
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: bilsem-junior-reels-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies and rendering tools
        run: |
          npm ci --ignore-scripts
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core python3-venv
          python3 -m venv .reels-venv
          .reels-venv/bin/pip install --disable-pip-version-check --no-cache-dir pillow==11.3.0

      - name: Select a checked original cognitive question
        env:
          REEL_DATE: ${{ inputs.reel_date }}
          REEL_GRADE: ${{ inputs.grade }}
          REEL_DIFFICULTY: ${{ inputs.difficulty }}
          REEL_MECHANIC: ${{ inputs.mechanic }}
          REEL_REQUEST_ID: ${{ inputs.request_id }}
        run: npx --no-install tsx scripts/reels/select-daily-question.ts

      - name: Create 1080x1920 MP4 with original audio
        run: .reels-venv/bin/python scripts/reels/render_reel.py

      - name: Validate MP4 stream and write Reels diagnostic summary
        run: |
          test -s reels-out/reel.mp4
          test -s reels-out/question.json
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height reels-out/reel.mp4
          python3 -c "
          import json, os
          from pathlib import Path
          q = json.loads(Path('reels-out/question.json').read_text(encoding='utf-8'))
          size_kb = round(Path('reels-out/reel.mp4').stat().st_size / 1024, 1)
          summary = (
              f'### BİLSEM Junior Reels Tanı Raporu\n'
              f'- **Tarih**: {q.get("day")}\n'
              f'- **Sınıf / Zorluk**: {q.get("grade")}. Sınıf / Seviye {q.get("difficulty")}\n'
              f'- **Konu (Mekanik)**: {q.get("mechanic")}\n'
              f'- **MP4 Boyutu**: {size_kb} KB (1080x1920 H.264 + AAC)\n'
          )
          print(summary)
          summary_path = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary_path:
              with open(summary_path, 'a', encoding='utf-8') as f:
                  f.write(summary + '\n')
          "

      - name: Keep MP4 and proof for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          include-hidden-files: false
          name: bilsem-junior-reel
          path: |
            reels-out/reel.mp4
            reels-out/question.json
          retention-days: 7

  manual-archive:
    # Manual runs never publish to Instagram, only save the generated MP4.
    # A main-only protected environment keeps the Storage key off untrusted branches.
    if: github.ref == 'refs/heads/main'
    needs: preview
    runs-on: ubuntu-24.04
    environment: production-reels
    timeout-minutes: 15
    steps:
      - name: Checkout uploader
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download generated MP4
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --name bilsem-junior-reel --dir reels-out
          test -s reels-out/reel.mp4
          test -s reels-out/question.json

      - name: Save manual preview to dedicated public video bucket
        if: github.event_name == 'workflow_dispatch'
        env:
          REELS_SUPABASE_URL: ${{ secrets.REELS_SUPABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          REELS_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.REELS_SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          IG_REELS_BUCKET: ${{ vars.IG_REELS_BUCKET }}
        run: python3 scripts/reels/upload_manual_preview.py

  scheduled-only:
    if: github.event_name == 'schedule' && vars.REELS_ENABLED == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Confirm authorized scheduled execution
        run: echo 'Scheduled publishing enabled'

  publish:
    # Security policy requires a protected environment AND an exact main-only gate.
    if: github.ref == 'refs/heads/main'
    needs: [preview, scheduled-only]
    runs-on: ubuntu-24.04
    environment: production-reels
    timeout-minutes: 35
    steps:
      - name: Checkout publishing script
        if: github.event_name == 'schedule' && vars.REELS_ENABLED == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Retrieve today's approved MP4 artifact
        if: github.event_name == 'schedule' && vars.REELS_ENABLED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --name bilsem-junior-reel --dir reels-out
          test -s reels-out/reel.mp4
          test -s reels-out/question.json

      - name: Publish through official Instagram API at 19:00 Türkiye
        if: github.event_name == 'schedule' && vars.REELS_ENABLED == 'true'
        env:
          REELS_ENABLED: "true"
          REELS_SCHEDULED: "true"
          SUPABASE_URL: ${{ secrets.REELS_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.REELS_SUPABASE_SERVICE_ROLE_KEY }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          IG_REELS_BUCKET: ${{ vars.IG_REELS_BUCKET }}
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION }}
        run: python3 scripts/reels/publish_reel.py
